<!DOCTYPE html>
<html>
<head>

  <!--  melhora carregamento das fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; outline: none !important; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06060a;
    }

    canvas {
      display: block;
      outline: none !important;
    }

    /*  evita custo de render invisível */
    #ui-panel,
    #fps-counter {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    /* BOTÕES (mantido igual) */
    .btn-primary {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #06060a;
      background: #e2c8a0;
      border: none;
      border-radius: 10px;
      padding: 14px 32px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
    }

    .btn-secondary {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 14px 28px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
    }

    /* VARIATION BAR */
    #variation-bar {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      z-index: 1000;
    }

    .morph-btn {
      padding: 10px 22px;
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.35);
      font-family: 'Instrument Serif', serif;
      cursor: pointer;
      transition: color 0.3s;
    }

    .morph-btn:hover {
      color: rgba(255,255,255,0.6);
    }

    .morph-btn.active {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    /* animações mantidas */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .anim-1 { animation: fadeUp 0.9s ease 0.2s both; }
    .anim-2 { animation: fadeUp 0.9s ease 0.35s both; }
    .anim-3 { animation: fadeUp 0.9s ease 0.5s both; }
    .anim-4 { animation: fadeUp 0.9s ease 0.65s both; }
    .anim-5 { animation: fadeUp 0.9s ease 0.8s both; }

  </style>

  <!--  IMPORTS MANTIDOS (ESSENCIAL) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
    }
  }
  </script>

</head>

<body>

  <!-- VARIATION BAR -->
  <div id="variation-bar">
    <button class="morph-btn active" data-variation="0">Autumn Maple</button>
    <button class="morph-btn" data-variation="1">Snowy Pine</button>
    <button class="morph-btn" data-variation="2">Cherry Blossom</button>
  </div>

  <!--  MANTIDO (não remove!) -->
  <div id="fps-counter">-- FPS</div>

  <div id="ui-panel">
    <!-- mantém tudo aqui igual ao seu original -->
  </div>

  <!--  SCRIPT COM DEFER IMPLÍCITO -->
  <script type="module" src="/script.js"></script>

</body>
</html>
